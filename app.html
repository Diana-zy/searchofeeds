    <script>
      window.pageLoadTime = performance.now();
      window.isUnloaded = false;
      window.done = false;
      window.done1 = false;

      window.addEventListener("beforeunload", () => {
        if (!window.done) {
          // 处理 AFS 广告埋点逻辑
          const activeElement = document.activeElement;
          const src = activeElement?.getAttribute("src") || "";
          let eventName = "";

          if (src.includes("afs/ads?")) {
            if (activeElement.getAttribute("title")) {
              if (window?.ttq?.track) {
                window.ttq?.track?.("Purchase");
              } else {
                window.taskList = window.taskList || [];
                window.taskList.push("Purchase");
              }
              window.pushEventParamsToGtm("T_AR");

              if (window.navigator.webdriver) {
                dataLayer.push({ event: "AR_DRIVER" });
              }
              if (document.visibilityState === "hidden") {
                dataLayer.push({ event: "AR_HIDDEN" });
              }
              const clickTime = performance.now();
              const timeElapsed = clickTime - window.pageLoadTime;
              if (timeElapsed > 3000) {
                dataLayer.push({ event: "AR_3" });
              } else if (timeElapsed > 2000) {
                dataLayer.push({ event: "AR_2" });
              } else if (timeElapsed > 1000) {
                dataLayer.push({ event: "AR_1" });
              } else {
                dataLayer.push({ event: "AR_0" });
              }
            } else {
              window.pushEventParamsToGtm("T_AC");
              if (window.location.pathname.startsWith("/detail")) {
                window.setCookie("click_ad", 1);
              }
            }
          } else if (src.includes("afs/ads/i/")) {
            eventName = "T_AG";
          }

          if (eventName) {
            dataLayer.push({ event: eventName });
            window.done = true;
          }
        }
      });

      // 监听失去焦点事件
      window.addEventListener("blur", () => {
        const activeElement = document.activeElement;
        const sourceAttribute = activeElement.getAttribute("src");

        // afs埋点
        if (sourceAttribute && sourceAttribute.includes("afs/ads?")) {
          if (activeElement.getAttribute("title")) {
            dataLayer.push({ event: "D_AR" });
          } else {
            dataLayer.push({ event: "D_AC" });
          }
        }
      });

      window.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          setTimeout(() => {
            window.done = false;
            window.done1 = false;
            window.pageLoadTime = performance.now();
            document.body.focus();
          }, 0);
        }
      });

      function HandleMessageTACANDTAR(e) {
        if (window.done1) {
          return;
        }
        const activeElement = document.activeElement;
        const src = activeElement?.getAttribute("src") || "";
        if (src.includes("afs/ads?")) {
          if (activeElement.getAttribute("title")) {
            dataLayer.push({
              event: "T_AR_NEW"
            });
            window.done1 = true;
          } else {
            if (window?.ttq?.track) {
              window.ttq?.track?.("AddToWishlist");
            } else {
              window.taskList = window.taskList || [];
              window.taskList.push("AddToWishlist");
            }
            dataLayer.push({ event: "T_AC_MSG" });
            window.done1 = true;
          }
        }
      }
      //TAC和TAR埋点监听消息
      window.addEventListener("message", (e) => {
        if (typeof e?.data === "string" && e?.data?.startsWith("FSXDC,.aCS:")) {
          HandleMessageTACANDTAR();
        }
      });
    </script>
